<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="MKRJ — Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080D"/>
      <stop offset="0.55" stop-color="#0A0E14"/>
      <stop offset="1" stop-color="#002A33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#39FF88"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9FEFFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00D9FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="neon" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="360" rx="18"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
      .sans { font-family: 'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif; }
      .scan { animation: scan 6s linear infinite; }
      @keyframes scan { from { transform: translateY(-80px); } to { transform: translateY(380px); } }
      .g1 { animation: g1 4s steps(1) infinite; }
      .g2 { animation: g2 4s steps(1) infinite; }
      @keyframes g1 { 0%,86%,100% { transform: translate(0,0); opacity:0 } 88% { transform: translate(-6px,2px); opacity:.85 } 91% { transform: translate(5px,-2px); opacity:.85 } 94% { transform: translate(-3px,0); opacity:.6 } }
      @keyframes g2 { 0%,86%,100% { transform: translate(0,0); opacity:0 } 88% { transform: translate(6px,-2px); opacity:.85 } 91% { transform: translate(-5px,2px); opacity:.85 } 94% { transform: translate(3px,0); opacity:.6 } }
            .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: 803px 278px; }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <!-- background -->
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
    <rect class="scan" x="0" y="0" width="1200" height="60" fill="url(#accent)" opacity="0.05"/>

    <!-- HUD corners -->
    <g stroke="url(#accent)" stroke-width="2" fill="none" opacity="0.9">
      <path d="M24 60V24H60"/><path d="M1140 24H1176V60"/>
      <path d="M24 300V336H60"/><path d="M1176 300V336H1140"/>
    </g>
    <text x="72" y="40" class="mono" font-size="12" fill="#00D9FF" opacity="0.55" letter-spacing="2">SYS://PROFILE.MKRJ0 — v2026</text>
    <text x="1128" y="40" class="mono" font-size="12" fill="#39FF88" opacity="0.55" letter-spacing="2" text-anchor="end">TEHRAN · UTC+3:30</text>

    <!-- name with glitch -->
    <g class="sans" font-size="132" font-weight="900" letter-spacing="10">
      <text class="g1" x="72" y="180" fill="#00D9FF">MKRJ</text>
      <text class="g2" x="72" y="180" fill="#39FF88">MKRJ</text>
      <text x="72" y="180" fill="url(#name)" filter="url(#neon)">MKRJ</text>
    </g>

    <!-- title -->
    <rect class="fade d1" x="76" y="204" width="56" height="4" rx="2" fill="url(#accent)"/>
    <text class="mono fade d1" x="146" y="210" font-size="20" fill="#E6EDF3" letter-spacing="6" font-weight="700">FULL STACK DEVELOPER</text>
    <text class="mono fade d2" x="76" y="250" font-size="17" fill="#8B949E" letter-spacing="1">
      <tspan fill="#00D9FF">React</tspan> · <tspan fill="#39FF88">Node.js</tspan> · <tspan fill="#00D9FF">TypeScript</tspan> · <tspan fill="#39FF88">Docker</tspan> · <tspan fill="#00D9FF">AI / RAG</tspan>
    </text>
    <text class="mono fade d3" x="76" y="300" font-size="15" fill="#6E7681">// building production-ready products, end to end.</text>

    <!-- terminal card -->
    <g class="fade d2">
      <rect x="760" y="92" width="380" height="210" rx="12" fill="#0D1117" fill-opacity="0.85" stroke="#00D9FF" stroke-opacity="0.35"/>
      <rect x="760" y="92" width="380" height="34" rx="12" fill="#161B22"/>
      <rect x="760" y="114" width="380" height="12" fill="#161B22"/>
      <circle cx="782" cy="109" r="6" fill="#FF5F56"/><circle cx="802" cy="109" r="6" fill="#FFBD2E"/><circle cx="822" cy="109" r="6" fill="#27C93F"/>
      <text x="950" y="114" class="mono" font-size="12" fill="#8B949E" text-anchor="middle">mkrj@edgerunner: ~</text>

      <g class="mono" font-size="15">
        <text x="782" y="156"><tspan fill="#39FF88">$</tspan><tspan fill="#E6EDF3"> whoami</tspan></text>
        <text x="782" y="180" fill="#00D9FF">→ full-stack developer</text>
        <text x="782" y="210"><tspan fill="#39FF88">$</tspan><tspan fill="#E6EDF3"> cat focus.txt</tspan></text>
        <text x="782" y="234" fill="#00D9FF">→ SaaS · AI apps · backends</text>
        <circle class="pulse" cx="789" cy="273" r="5" fill="#39FF88"/>
        <text x="802" y="278" fill="#39FF88">open to work</text>
        <rect class="blink" x="918" y="265" width="9" height="16" fill="#00D9FF"/>
      </g>
    </g>

    <!-- bottom accent bar -->
    <rect x="0" y="352" width="1200" height="8" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="18" fill="none" stroke="#00D9FF" stroke-opacity="0.25"/>
</svg>
